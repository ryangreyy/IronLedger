<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONLEDGER — Calendar Card (Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>

.mockup-section { max-width:900px; margin:0 auto; padding:80px 28px; }

.mockup-label {
  font-family:var(--mono); font-size:11px; text-transform:uppercase;
  letter-spacing:0.2em; color:var(--text-dimmer); margin-bottom:32px;
  display:flex; align-items:center; gap:10px;
}
.mockup-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ---- KPI GRID (for context) ---- */
.kpi-context-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:18px;
}

/* ---- CALENDAR CARD ---- */
.cal-card {
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:20px; padding:26px 24px;
}
.cal-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;
}
.cal-eyebrow {
  font-family:var(--mono); font-size:11px; text-transform:uppercase;
  letter-spacing:0.2em; color:var(--accent); font-weight:700;
}
.cal-month-nav {
  display:flex; align-items:center; gap:10px;
}
.cal-month-label {
  font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text);
  min-width:96px; text-align:center;
}
.cal-nav-btn {
  background:transparent; border:1px solid var(--border-strong); color:var(--text-dim);
  width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; line-height:1;
  transition:color .15s, border-color .15s;
}
.cal-nav-btn:hover { color:var(--accent); border-color:var(--accent); }

/* ---- GRID ---- */
.cal-grid {
  display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
}
.cal-dow {
  font-family:var(--mono); font-size:10px; text-transform:uppercase;
  letter-spacing:0.1em; color:var(--text-dimmer); text-align:center;
  padding-bottom:8px;
}
.cal-day {
  aspect-ratio:1; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:12px; font-weight:700;
  color:var(--text-dimmer); position:relative; cursor:default;
  transition:transform .1s;
}
.cal-day.empty { pointer-events:none; }
.cal-day.future { color:var(--border-strong); }

/* session day — colored dot + number */
.cal-day.has-session {
  color:#0B0C0E; font-weight:800;
}
.cal-day.has-session::before {
  content:''; position:absolute; inset:3px;
  border-radius:6px; z-index:0;
}
.cal-day.has-session span { position:relative; z-index:1; }

.cal-day.squat::before  { background:var(--squat); }
.cal-day.bench::before  { background:var(--bench); }
.cal-day.dead::before   { background:var(--dead); }
.cal-day.rest-day { color:var(--text-dimmer); }
.cal-day.rest-day::before {
  content:''; position:absolute; inset:3px;
  border-radius:6px; z-index:0;
  background:rgba(107,114,128,0.18);
}

/* today ring */
.cal-day.today::after {
  content:''; position:absolute; inset:1px;
  border-radius:9px; border:2px solid var(--accent);
  pointer-events:none; z-index:2;
}
.cal-day.today.has-session::after { border-color:#0B0C0E; }

/* ---- LEGEND ---- */
.cal-legend {
  display:flex; gap:18px; margin-top:18px; flex-wrap:wrap;
}
.cal-legend-item {
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:11px; color:var(--text-dim);
}
.cal-legend-dot {
  width:12px; height:12px; border-radius:3px; flex-shrink:0;
}
.cal-legend-dot.squat { background:var(--squat); }
.cal-legend-dot.bench { background:var(--bench); }
.cal-legend-dot.dead  { background:var(--dead); }
.cal-legend-dot.rest  { background:rgba(107,114,128,0.35); border:1px solid var(--border-strong); }

</style>
</head>
<body>

<div class="mockup-section">

  <div class="mockup-label">Calendar Card — Preview</div>

  <!-- Surrounding KPI cards for context -->
  <div class="kpi-context-grid">
    <div class="card" style="padding:22px 24px;">
      <div style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dimmer);margin-bottom:8px;">Days Lifted</div>
      <div style="font-size:32px;font-weight:800;font-family:var(--display);">8</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">this month</div>
    </div>
    <div class="card" style="padding:22px 24px;">
      <div style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dimmer);margin-bottom:8px;">Current Streak</div>
      <div style="font-size:32px;font-weight:800;font-family:var(--display);">5 🔥</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">days in a row</div>
    </div>
    <div class="card" style="padding:22px 24px;">
      <div style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dimmer);margin-bottom:8px;">Top Lift</div>
      <div style="font-size:32px;font-weight:800;font-family:var(--display);">405</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">lbs deadlift</div>
    </div>
  </div>

  <!-- CALENDAR CARD -->
  <div class="cal-card">

    <div class="cal-header">
      <span class="cal-eyebrow">Calendar</span>
      <div class="cal-month-nav">
        <button class="cal-nav-btn">&#8592;</button>
        <span class="cal-month-label">JUNE 2026</span>
        <button class="cal-nav-btn">&#8594;</button>
      </div>
    </div>

    <div class="cal-grid" id="calGrid">
      <!-- Day-of-week headers -->
      <div class="cal-dow">Su</div>
      <div class="cal-dow">Mo</div>
      <div class="cal-dow">Tu</div>
      <div class="cal-dow">We</div>
      <div class="cal-dow">Th</div>
      <div class="cal-dow">Fr</div>
      <div class="cal-dow">Sa</div>
    </div>

    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot squat"></div> Squat</div>
      <div class="cal-legend-item"><div class="cal-legend-dot bench"></div> Bench</div>
      <div class="cal-legend-item"><div class="cal-legend-dot dead"></div> Deadlift</div>
      <div class="cal-legend-item"><div class="cal-legend-dot rest"></div> Rest Day</div>
    </div>

  </div>

</div>

<script>
// Sample session data for June 2026
// Format: day number → lift class (squat/bench/dead/rest-day)
const sessions = {
  2:  'dead',
  3:  'bench',
  4:  'squat',
  5:  'rest-day',
  6:  'dead',
  7:  'bench',
  8:  'squat',   // today
};

const today = 8; // June 8
const year = 2026;
const month = 5; // 0-indexed June

// June 1 2026 = Monday → startDow = 1
const firstDay = new Date(year, month, 1).getDay(); // 1 = Monday
const daysInMonth = new Date(year, month + 1, 0).getDate(); // 30

const grid = document.getElementById('calGrid');

// Empty cells before month start
for (let i = 0; i < firstDay; i++) {
  const blank = document.createElement('div');
  blank.className = 'cal-day empty';
  grid.appendChild(blank);
}

// Day cells
for (let d = 1; d <= daysInMonth; d++) {
  const cell = document.createElement('div');
  const sess = sessions[d];
  const isToday = d === today;
  const isFuture = d > today;

  let cls = 'cal-day';
  if (isFuture) cls += ' future';
  if (sess) cls += ' has-session ' + sess;
  if (isToday) cls += ' today';

  cell.className = cls;
  cell.innerHTML = `<span>${d}</span>`;

  // Tooltip
  const labels = { squat:'Squat', bench:'Bench Press', dead:'Deadlift', 'rest-day':'Rest Day' };
  if (sess) cell.title = labels[sess] || sess;

  grid.appendChild(cell);
}
</script>

</body>
</html>
