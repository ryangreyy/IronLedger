<!-- IRONGLADIATOR — Friends Activity Feed -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONGLADIATOR — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=98">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<style>
/* ── Feed page wrapper ── */
.feed-wrap{ max-width:820px; margin:0 auto; padding:80px 20px 120px; }
.feed-empty{ font-family:var(--mono); font-size:13px; color:var(--text-dimmer); padding:32px 0; }
.feed-loading{ font-family:var(--mono); font-size:13px; color:var(--text-dimmer); padding:24px 0; }

/* ── Day header ── */
.feed-day-label{
  font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:0.18em; text-transform:uppercase;
  color:var(--text-dimmer); margin:28px 0 12px;
  padding-bottom:8px; border-bottom:1px solid var(--border);
}
.feed-day-label:first-child{ margin-top:0; }

/* ── 2-column grid per day ── */
.feed-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:4px;
}

/* ── C3 card ── */
.c3-card{
  padding:0 !important;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:border-color 0.15s;
}
.c3-card:hover{ border-color:var(--border-strong); }

.c3-bar{
  height:5px;
  width:100%;
  flex-shrink:0;
}

.c3-inner{
  padding:14px 16px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  flex:1;
}

/* ── Card header: avatar + username ── */
.c3-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.c3-meta{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.c3-username{
  font-family:var(--mono); font-size:12px; font-weight:700;
  color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.c3-when{
  font-family:var(--mono); font-size:10px; color:var(--text-dimmer);
  text-transform:uppercase; letter-spacing:0.1em;
}

/* ── Avatar ── */
.c3-avatar{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:#8b1c1c; position:relative; overflow:hidden;
}

/* ── Lift rows ── */
.c3-lifts{ display:flex; flex-direction:column; gap:5px; }

/* each lift gets its own tinted block */
.c3-lift-block{
  background:rgba(255,255,255,0.05);
  border-radius:6px;
  padding:8px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.c3-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.c3-dot{
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.c3-lift-name{
  font-family:var(--body); font-size:12px; font-weight:600;
  color:var(--text); flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.c3-lift-stat{
  font-family:var(--mono); font-size:11px; color:var(--text-dim);
  white-space:nowrap; flex-shrink:0;
}

/* ── Rest day card body ── */
.c3-rest{
  font-family:var(--mono); font-size:12px; color:var(--text-dimmer);
  display:flex; align-items:center; gap:6px;
}

/* ── Note line (inside lift block, indented past the dot) ── */
.c3-note{
  font-size:11px; color:var(--text-dim); font-style:italic;
  padding-left:16px; line-height:1.4;
}

/* ── Gate (not signed in) ── */
.feed-gate{
  max-width:480px; margin:140px auto 0; text-align:center; padding:0 24px;
}
.feed-gate .eyebrow{ margin-bottom:10px; }
.feed-gate h2{ margin-bottom:12px; }
.feed-gate p{ font-size:14px; color:var(--text-dim); margin-bottom:28px; }

/* ── Reaction bar ── */
.rxn-bar{display:flex;align-items:center;gap:5px;padding-top:11px;border-top:1px solid rgba(255,255,255,.055);margin-top:10px}
.rxn-main{display:inline-flex;align-items:center;gap:5px;padding:5px 12px 5px 10px;border-radius:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;font-size:17px;line-height:1;transition:all .15s ease;flex-shrink:0}
.rxn-main:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);transform:scale(1.04)}
.rxn-main .rxn-ct{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45)}
.rxn-main.rxn-on{border-color:rgba(255,55,85,.65);background:rgba(255,55,85,.13)}
.rxn-main.rxn-on .rxn-ct{color:#ff6080}
.rxn-tog{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-size:16px;color:rgba(255,255,255,.3);transition:all .15s;flex-shrink:0}
.rxn-tog:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);transform:scale(1.06)}
.rxn-tog.rxn-open{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.65)}
.rxn-slide{display:flex;gap:5px;overflow:hidden;max-width:0;opacity:0;transition:max-width .3s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.rxn-slide.rxn-open{max-width:260px;opacity:1}
.rxn-extra{display:inline-flex;align-items:center;gap:5px;padding:5px 12px 5px 10px;border-radius:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;font-size:17px;line-height:1;transition:all .15s ease;flex-shrink:0;white-space:nowrap}
.rxn-extra:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);transform:scale(1.04)}
.rxn-extra .rxn-ct{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45)}
.rxn-extra.rxn-fire{border-color:rgba(255,125,0,.6);background:rgba(255,125,0,.13)}
.rxn-extra.rxn-fire .rxn-ct{color:#ff9020}
.rxn-extra.rxn-skull{border-color:rgba(155,175,255,.5);background:rgba(155,175,255,.1)}
.rxn-extra.rxn-skull .rxn-ct{color:#a0b4ff}
.rxn-extra.rxn-ins{border-color:rgba(255,200,0,.55);background:rgba(255,200,0,.1)}
.rxn-extra.rxn-ins .rxn-ct{color:#ffc400}

@media(max-width:680px){
  .feed-wrap{ padding:72px 14px 100px; }
  .feed-grid{ grid-template-columns:1fr; }
}
</style>
</head>

      <div class="eyebrow">Social</div>

      <p style="font-family:var(--mono);font-size:11px;color:var(--text-dimmer);margin-bottom:28px;letter-spacing:0.08em;">LAST 7 DAYS</p>
      <div id="feedContainer"><p class="feed-loading">Loading…</p></div>

  </div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  const EMBLEMS = {gladius:'ti-sword',scutum:'ti-shield',summit:'ti-mountain',inferno:'ti-flame',surge:'ti-bolt',iron:'ti-barbell',duellum:'ti-swords',target:'ti-target',anchor:'ti-anchor',skull:'ti-skull',securis:'ti-axe',tridens:'ti-spade',serpens:'ti-dna-2',taurus:'ti-chess-rook',corona:'ti-crown',dagger:'ti-tools',storm:'ti-tornado',rex:'ti-chess-king'};

  /* Default muscle group colors — overridden per-user from their settings */
  const CLS_DEFAULTS = {
    squat: '#D6FF3D',
    bench: '#5BD6E6',
    dead:  '#FF8A4C',
    arm:   '#B78BFF'
  };
  const CLS_FALLBACK = '#c1272d';

  const RXN_TYPES  = ['heart', 'fire', 'skull', 'ins'];
  const RXN_EMOJI  = { heart: '❤️', fire: '🔥', skull: '💀', ins: '🤯' };
  const RXN_CLASS  = { fire: 'rxn-fire', skull: 'rxn-skull', ins: 'rxn-ins' };

  /* Build a color map from a friend's settings doc */
  function clsColors(settings) {
    return {
      squat: settings?.colorSquat || CLS_DEFAULTS.squat,
      bench: settings?.colorBench || CLS_DEFAULTS.bench,
      dead:  settings?.colorDead  || CLS_DEFAULTS.dead,
      arm:   settings?.colorPress || CLS_DEFAULTS.arm,
    };
  }

  function formatFeedDate(dateRaw) {
    if (!dateRaw) return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateRaw + 'T12:00:00');
    const diff = Math.round((today - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return diff + ' days ago';
  }

  /* Build avatar HTML — uses 32×32 for C3 cards */
  function buildAvatarEl(settings, username) {
    const photoUrl = settings?.avatarPhotoUrl;
    if (photoUrl) {
      return `<div class="c3-avatar feed-avatar-photo"
        data-photourl="${photoUrl.replace(/"/g,'&quot;')}"
        data-zoom="${settings.avatarZoom || 1}"
        data-posx="${settings.avatarPosX != null ? settings.avatarPosX : 50}"
        data-posy="${settings.avatarPosY != null ? settings.avatarPosY : 50}"></div>`;
    }
    const avatarId = settings?.avatarId;
    const icon = avatarId && EMBLEMS[avatarId];
    if (icon) {
      const ring  = settings.avatarRingColor || '#d4af37';
      const bg    = settings.avatarBgColor   || '#8b1c1c';
      const color = settings.avatarIconColor || '#fff';
      return `<div class="c3-avatar" style="background:${bg};box-shadow:inset 0 0 0 2px ${ring};display:flex;align-items:center;justify-content:center;">
        <i class="ti ${icon}" style="font-size:12px;color:${color};" aria-hidden="true"></i></div>`;
    }
    const initial = (username || '?').charAt(0).toUpperCase();
    return `<div class="c3-avatar" style="background:#8b1c1c;box-shadow:inset 0 0 0 2px #d4af37;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:#fff;">${initial}</div>`;
  }

  /* Apply photo avatars after HTML is injected */
  function applyPhotoAvatars() {
    document.querySelectorAll('.feed-avatar-photo[data-photourl]').forEach(el => {
      const url  = el.dataset.photourl;
      const zoom = parseFloat(el.dataset.zoom) || 1;
      const posX = parseFloat(el.dataset.posx) || 50;
      const posY = parseFloat(el.dataset.posy) || 50;
      el.style.cssText = 'overflow:hidden;background:transparent;position:relative;width:32px;height:32px;border-radius:50%;flex-shrink:0;';
      const img = document.createElement('img');
      img.alt = '';
      img.style.cssText = 'position:absolute;object-fit:fill;';
      img.onload = function () {
        const cW = 32, cH = 32;
        const base = Math.max(cW / img.naturalWidth, cH / img.naturalHeight);
        const dW = img.naturalWidth  * base * zoom;
        const dH = img.naturalHeight * base * zoom;
        img.style.width  = dW + 'px';
        img.style.height = dH + 'px';
        img.style.left   = -((dW - cW) * posX / 100) + 'px';
        img.style.top    = -((dH - cH) * posY / 100) + 'px';
      };
      img.src = url;
      el.appendChild(img);
    });
  }

  /* Fetch reaction counts for all cards and apply active states */
  async function loadReactions(myUid, container) {
    const bars = container.querySelectorAll('.rxn-bar[data-frienduid]');
    if (!bars.length) return;
    const results = await Promise.all(Array.from(bars).map(bar =>
      db.doc(`feedReactions/${bar.dataset.frienduid}_${bar.dataset.dateraw}`).get()
        .then(snap => ({ bar, data: snap.exists ? snap.data() : {} }))
    ));
    results.forEach(({ bar, data }) => {
      RXN_TYPES.forEach(type => {
        const voters = data[type] || {};
        const count  = Object.keys(voters).length;
        const active = voters[myUid] === true;
        const btn    = bar.querySelector(`[data-type="${type}"]`);
        if (!btn) return;
        const ct = btn.querySelector('.rxn-ct');
        if (ct) ct.textContent = count > 0 ? count : '';
        if (type === 'heart') {
          btn.classList.toggle('rxn-on', active);
        } else {
          btn.classList.toggle(RXN_CLASS[type], active);
        }
      });
    });
  }

  /* Toggle a reaction in Firestore with optimistic UI update */
  async function handleReactionClick(e, myUid) {
    const tog = e.target.closest('.rxn-tog');
    if (tog) {
      const slide = tog.nextElementSibling;
      if (slide?.classList.contains('rxn-slide')) {
        const open = slide.classList.toggle('rxn-open');
        tog.textContent = open ? '×' : '+';
        tog.classList.toggle('rxn-open', open);
      }
      return;
    }
    const btn = e.target.closest('[data-type]');
    if (!btn) return;
    const bar = btn.closest('.rxn-bar');
    if (!bar) return;
    const type     = btn.dataset.type;
    const docRef   = db.doc(`feedReactions/${bar.dataset.frienduid}_${bar.dataset.dateraw}`);
    const isActive = type === 'heart'
      ? btn.classList.contains('rxn-on')
      : btn.classList.contains(RXN_CLASS[type]);
    const ct       = btn.querySelector('.rxn-ct');
    const prev     = parseInt(ct?.textContent || '0') || 0;
    const next     = isActive ? Math.max(0, prev - 1) : prev + 1;

    if (ct) ct.textContent = next || '';
    if (type === 'heart') btn.classList.toggle('rxn-on', !isActive);
    else btn.classList.toggle(RXN_CLASS[type], !isActive);

    try {
      if (isActive) {
        await docRef.update({ [`${type}.${myUid}`]: firebase.firestore.FieldValue.delete() });
      } else {
        await docRef.set({ [type]: { [myUid]: true } }, { merge: true });
      }
    } catch {
      if (ct) ct.textContent = prev || '';
      if (type === 'heart') btn.classList.toggle('rxn-on', isActive);
      else btn.classList.toggle(RXN_CLASS[type], isActive);
    }
  }

  /* Determine which cls appears most in a group of sessions */
  function dominantCls(sessions) {
    const counts = {};
    for (const s of sessions) {
      if (s.cls) counts[s.cls] = (counts[s.cls] || 0) + 1;
    }
    if (!Object.keys(counts).length) return null;
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
  }

  /* Render one C3 card for a single friend on a single day.
     colors = viewer's own palette so the feed matches their settings. */
  function renderFriendDayCard(friendUid, username, settings, sessions, dateRaw, colors) {
    const avatar   = buildAvatarEl(settings, username);
    const dateStr  = formatFeedDate(dateRaw);
    const lifts    = sessions.filter(s => !s.isRestDay);
    const restOnly = !lifts.length;

    const dom      = dominantCls(lifts);
    const barColor = colors[dom] || CLS_FALLBACK;

    /* Build lift rows */
    let liftRowsHtml = '';
    if (restOnly) {
      liftRowsHtml = `<div class="c3-rest"><i class="ti ti-moon" aria-hidden="true"></i>Rest day</div>`;
    } else {
      const rows = lifts.map(s => {
        const dot  = colors[s.cls] || '#888';
        const wt   = s.wt   ? s.wt + ' lbs' : '';
        const vol  = (s.sets && s.reps) ? `${s.sets}×${s.reps}` : '';
        const stat = [wt, vol].filter(Boolean).join(' · ');
        const note = s.note ? `<div class="c3-note">${s.note}</div>` : '';
        return `<div class="c3-lift-block">
          <div class="c3-row">
            <div class="c3-dot" style="background:${dot};"></div>
            <span class="c3-lift-name">${s.lift || '—'}</span>
            ${stat ? `<span class="c3-lift-stat">${stat}</span>` : ''}
          </div>${note}
        </div>`;
      });
      liftRowsHtml = `<div class="c3-lifts">${rows.join('')}</div>`;
    }

    const rxnBar = `<div class="rxn-bar" data-frienduid="${friendUid}" data-dateraw="${dateRaw}">
      <button class="rxn-main" data-type="heart">${RXN_EMOJI.heart} <span class="rxn-ct"></span></button>
      <button class="rxn-tog">+</button>
      <div class="rxn-slide">
        <button class="rxn-extra" data-type="fire">${RXN_EMOJI.fire} <span class="rxn-ct"></span></button>
        <button class="rxn-extra" data-type="skull">${RXN_EMOJI.skull} <span class="rxn-ct"></span></button>
        <button class="rxn-extra" data-type="ins">${RXN_EMOJI.ins} <span class="rxn-ct"></span></button>
      </div>
    </div>`;

    return `<div class="c3-card card">
      <div class="c3-bar" style="background:${barColor};"></div>
      <div class="c3-inner">
        <div class="c3-head">
          ${avatar}
          <div class="c3-meta">
            <div class="c3-username">@${username}</div>
            <div class="c3-when">${dateStr}</div>
          </div>
        </div>
        ${liftRowsHtml}
        ${rxnBar}
      </div>
    </div>`;
  }

  async function loadFeed(myUid) {
    const container = document.getElementById('feedContainer');
    if (!container) return;
    container.innerHTML = '<p class="feed-loading">Loading…</p>';

    try {
      const [sentSnap, recvSnap, mySettingsSnap] = await Promise.all([
        db.collection('friendRequests').where('fromUid', '==', myUid).where('status', '==', 'accepted').get(),
        db.collection('friendRequests').where('toUid',   '==', myUid).where('status', '==', 'accepted').get(),
        db.doc(`users/${myUid}/settings/main`).get()
      ]);

      /* Build color palette from the viewer's own settings */
      const viewerColors = clsColors(mySettingsSnap.exists ? mySettingsSnap.data() : {});
      const friends = [
        ...sentSnap.docs.map(d => ({ uid: d.data().toUid,   username: d.data().toUsername   })),
        ...recvSnap.docs.map(d => ({ uid: d.data().fromUid, username: d.data().fromUsername }))
      ];

      if (!friends.length) {
        container.innerHTML = '<p class="feed-empty">Add friends on your profile to see their workouts here.</p>';
        return;
      }

      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 7);
      const cutoffStr = cutoff.toISOString().slice(0, 10);

      const perFriend = await Promise.all(friends.map(async f => {
        const [sessSnap, settingsSnap] = await Promise.all([
          db.collection(`users/${f.uid}/sessions`)
            .where('dateRaw', '>=', cutoffStr)
            .orderBy('dateRaw', 'desc')
            .limit(30)
            .get(),
          db.doc(`users/${f.uid}/settings/main`).get()
        ]);
        const settings = settingsSnap.exists ? settingsSnap.data() : {};
        const username = settings.username || f.username;
        return { uid: f.uid, username, settings, sessions: sessSnap.docs.map(d => ({ ...d.data(), id: d.id })) };
      }));

      /* Group by date → uid → { username, settings, sessions[] } */
      const byDate = {};
      for (const f of perFriend) {
        for (const s of f.sessions) {
          if (!s.dateRaw) continue;
          if (!byDate[s.dateRaw]) byDate[s.dateRaw] = {};
          if (!byDate[s.dateRaw][f.uid]) {
            byDate[s.dateRaw][f.uid] = { username: f.username, settings: f.settings, sessions: [] };
          }
          byDate[s.dateRaw][f.uid].sessions.push(s);
        }
      }

      const dates = Object.keys(byDate).sort().reverse();
      if (!dates.length) {
        container.innerHTML = '<p class="feed-empty">None of your friends have logged sessions in the last 7 days.</p>';
        return;
      }

      let html = '';
      for (const date of dates) {
        html += `<div class="feed-day-label">${formatFeedDate(date)}</div>`;
        html += '<div class="feed-grid">';
        for (const uid of Object.keys(byDate[date])) {
          const { username, settings, sessions } = byDate[date][uid];
          html += renderFriendDayCard(uid, username, settings, sessions, date, viewerColors);
        }
        html += '</div>';
      }

      container.innerHTML = html;
      applyPhotoAvatars();
      loadReactions(myUid, container);
      container.addEventListener('click', e => handleReactionClick(e, myUid));

    } catch (err) {
      container.innerHTML = `<p style="color:var(--down);font-family:var(--mono);font-size:13px;">Error: ${err.message}</p>`;
    }
  }

  auth.onAuthStateChanged(user => {
    const gate = document.getElementById('feed-gate');
    const page = document.getElementById('feed-page');
    if (user) {
      if (gate) gate.style.display = 'none';
      if (page) page.style.display = '';
      loadFeed(user.uid);
    } else {
      if (gate) gate.style.display = '';
      if (page) page.style.display = 'none';
    }
  });
</script>
<script src="nav-auth.js"></script>
</body>
</html>
