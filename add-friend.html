  <!-- ADD FRIEND PAGE -->
  <section class="af-wrap">
    <div class="card af-card" id="afCard">
      <p class="af-loading">Loading…</p>
    </div>
  </section>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js?v=1"></script>
<script>
(function () {
  const auth = firebase.auth();
  const db   = firebase.firestore();
  const card = document.getElementById('afCard');
  const targetUid = new URLSearchParams(location.search).get('u');

  function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderMessage(icon, title, sub, actionHtml) {
    card.innerHTML = `
      <div class="af-status-icon">${icon}</div>
      <p class="af-username">${title}</p>
      <p class="af-msg">${sub}</p>
      ${actionHtml || '<a href="feed.html" class="btn btn-primary" style="width:100%;">Go to Feed</a>'}
    `;
  }

  async function run(user) {
    if (!targetUid) {
      renderMessage('🔗', 'Invalid link', 'This add-friend link is missing a code. Ask your friend to share their QR code again.');
      return;
    }
    if (targetUid === user.uid) {
      renderMessage('🙂', "That's you!", 'This is your own QR code — share it with a friend so they can add you.');
      return;
    }

    let targetSettings, mySettings;
    try {
      [targetSettings, mySettings] = await Promise.all([
        db.doc(`users/${targetUid}/settings/main`).get(),
        db.doc(`users/${user.uid}/settings/main`).get(),
      ]);
    } catch (err) {
      renderMessage('⚠️', 'Something went wrong', esc(err.message));
      return;
    }

    if (!targetSettings.exists) {
      renderMessage('❓', 'User not found', "This QR code doesn't match an IronGladiator account.");
      return;
    }

    const td = targetSettings.data() || {};
    const md = mySettings.exists ? mySettings.data() || {} : {};
    const targetUsername = td.username || td.displayName || 'Athlete';
    const myUsername = md.username || md.displayName || user.displayName || user.email?.split('@')[0] || 'Athlete';
    const initial = targetUsername.charAt(0).toUpperCase();

    const [sentSnap, recvSnap] = await Promise.all([
      db.collection('friendRequests').where('fromUid', '==', user.uid).where('toUid', '==', targetUid).limit(1).get(),
      db.collection('friendRequests').where('fromUid', '==', targetUid).where('toUid', '==', user.uid).limit(1).get(),
    ]);

    let relation = 'none', reqDoc = null;
    if (!sentSnap.empty) {
      reqDoc = sentSnap.docs[0];
      relation = reqDoc.data().status === 'accepted' ? 'friends' : 'sent';
    } else if (!recvSnap.empty) {
      reqDoc = recvSnap.docs[0];
      relation = reqDoc.data().status === 'accepted' ? 'friends' : 'received';
    }

    const avatarHtml = `<div class="af-avatar">${initial}</div>`;

    if (relation === 'friends') {
      card.innerHTML = `
        ${avatarHtml}
        <p class="af-username">@${esc(targetUsername)}</p>
        <p class="af-sub">You're already friends.</p>
        <a href="feed.html" class="btn btn-primary" style="width:100%;">Go to Feed</a>
      `;
      return;
    }

    if (relation === 'sent') {
      card.innerHTML = `
        ${avatarHtml}
        <p class="af-username">@${esc(targetUsername)}</p>
        <p class="af-sub">You've already sent a friend request — waiting on them to accept.</p>
        <a href="feed.html" class="btn btn-primary" style="width:100%;">Go to Feed</a>
      `;
      return;
    }

    if (relation === 'received') {
      card.innerHTML = `
        ${avatarHtml}
        <p class="af-username">@${esc(targetUsername)}</p>
        <p class="af-sub">@${esc(targetUsername)} already sent you a friend request.</p>
        <button id="afAcceptBtn" class="btn btn-primary" style="width:100%;margin-bottom:8px;">Accept Request</button>
        <button id="afDeclineBtn" class="btn btn-ghost" style="width:100%;">Decline</button>
      `;
      document.getElementById('afAcceptBtn').addEventListener('click', async e => {
        e.target.disabled = true;
        e.target.textContent = 'Accepting…';
        try {
          await db.doc(`friendRequests/${reqDoc.id}`).update({ status: 'accepted' });
          renderMessage('✅', "You're friends!", `You and @${esc(targetUsername)} are now connected.`);
        } catch (err) {
          e.target.disabled = false;
          e.target.textContent = 'Accept Request';
          alert('Could not accept: ' + err.message);
        }
      });
      document.getElementById('afDeclineBtn').addEventListener('click', async e => {
        e.target.disabled = true;
        try {
          await db.doc(`friendRequests/${reqDoc.id}`).delete();
          renderMessage('👍', 'Request declined', '');
        } catch (err) {
          e.target.disabled = false;
          alert('Could not decline: ' + err.message);
        }
      });
      return;
    }

    /* relation === 'none' -- the actual QR-scan case */
    card.innerHTML = `
      ${avatarHtml}
      <p class="af-username">@${esc(targetUsername)}</p>
      <p class="af-sub">wants to know if you'd like to connect on IronGladiator.</p>
      <button id="afSendBtn" class="btn btn-primary" style="width:100%;margin-bottom:8px;">Send Friend Request</button>
      <button id="afNotNowBtn" class="btn btn-ghost" style="width:100%;">Not now</button>
    `;
    document.getElementById('afSendBtn').addEventListener('click', async e => {
      e.target.disabled = true;
      e.target.textContent = 'Sending…';
      try {
        await db.collection('friendRequests').add({
          fromUid:      user.uid,
          toUid:        targetUid,
          fromUsername: myUsername,
          toUsername:   targetUsername,
          status:       'pending',
          sentAt:       firebase.firestore.FieldValue.serverTimestamp(),
        });
        renderMessage('✅', 'Request sent!', `@${esc(targetUsername)} will see your request in their Feed.`);
      } catch (err) {
        e.target.disabled = false;
        e.target.textContent = 'Send Friend Request';
        alert('Could not send request: ' + err.message);
      }
    });
    document.getElementById('afNotNowBtn').addEventListener('click', () => { location.href = 'feed.html'; });
  }

  function handleAddFriendAuthState(user) {
    if (user) {
      try { sessionStorage.removeItem('ig-pending-friend-uid'); } catch (e) {}
      run(user);
    }
    /* Signed-out: nav-auth.js owns the bounce to index.html. The head
       guard already stashed the target uid in sessionStorage above, so
       app.js picks it back up and returns here once sign-in completes. */
  }

  let addFriendAuthDeferredForAppLock = false;
  auth.onAuthStateChanged(user => {
    if (window.IGAppLock?.isLocked()) {
      if (!addFriendAuthDeferredForAppLock) {
        addFriendAuthDeferredForAppLock = true;
        window.IGAppLock.afterUnlock(() => {
          addFriendAuthDeferredForAppLock = false;
          handleAddFriendAuthState(auth.currentUser);
        });
      }
      return;
    }
    handleAddFriendAuthState(user);
  });
})();
</script>
<script src="nav-auth.js?v=5"></script>
